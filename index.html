<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/clear-list.css" />
    <link rel="stylesheet" href="style/compound.css" />
    <link rel="stylesheet" href="style/card.css" />
    <link rel="stylesheet" href="style/title.css" />
    <link rel="stylesheet" href="style/products.css" />
    <link rel="stylesheet" href="style/catalog.css" />
    <link rel="stylesheet" href="style/container.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <button id="change-color-first-card-button">
      Сменить цвет первой карточки
    </button>
    <button id="change-color-all-cards-button">
      Сменить цвет всех карточек
    </button>
    <button id="open-google-button">Открыть Google</button>
    <button id="output-console-log-button">
      Вывести сообщение в консоль лог
    </button>
    <button class="change-color-button active--button">СМЕНИ МОЙ ЦВЕТ</button>
    <main class="catalog">
      <div class="container catalog__container">
        <h1 class="catalog__title title">Выбери свой продукт</h1>

        <ul class="products clear-list">
          <template id="cards__template">
            <li class="products__item card">
              <img class="card__image" src="" alt="" />
              <span class="card__category"></span>
              <h2 class="card__name"></h2>
              <p class="card__description"></p>
              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="compound__list">
                  <li class="compound__list-1"></li>
                  <li class="compound__list-2"></li>
                  <li class="compound__list-3"></li>
                </ul>
              </div>
              <div class="card__price">
                <b>Цена:</b>
                <span class="card__value"></span>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </main>
    <script src="main.js"></script>
    <script src="homework-10.js" type="module"></script>
    <script src="cards-data.js" type="module"></script>
  </body>
</html>
